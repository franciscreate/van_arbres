const ss=x=>{x=Math.min(1,Math.max(0,x));return x*x*(3-2*x)};
// profil de vitesse du véhicule : démarrage, croisière, freinage jusqu'à l'arrêt exact à T

const N=Math.ceil(T*240)+2,DT=new Float32Array(N);for(let i=1;i<N;i++)DT[i]=DT[i-1]+(g((i-1)/240)+g(i/240))/2/240;

// distance parcourue par les arbres de passage : le véhicule ne passe pas sous 60 % de sa vitesse pour eux (ils doivent tous sortir du cadre) ; le dernier arbre suit le freinage réel
const GF=.6,DG=new Float32Array(N);for(let i=1;i<N;i++)DG[i]=DG[i-1]+(Math.max(g((i-1)/240),GF)+Math.max(g(i/240),GF))/2/240;

const TABLE=[[7,1.00,0.66,-1.398],[5,0.95,0.83,-0.737],[4,1.15,0.45,-1.437],[10,0.80,0.40,-1.391],[2,1.15,0.50,-0.693],[9,1.35,0.52,0.022],[3,0.95,0.46,0.173],[1,0.88,0.60,1.173],[6,1.00,0.90,2.982],[8,0.92,1.60,5.0],[10,1.25,1.20,4.2]];

function drawTrees(t,Dd,gv){
  tx.setTransform(1,0,0,1,0,0);tx.clearRect(0,0,tl.width,tl.height);tx.fillStyle=INK;
  const s=tl.width/FW;
  const one=(tr,xc,cx0,sc,a,L)=>{
    const put=(off,al)=>{tx.setTransform(s,0,0,s,-X0*s,-Y0*s);tx.globalAlpha=al;tx.translate(xc+off,BASE);tx.scale(sc,sc);tx.translate(-cx0,-BASE);tx.fill(tr.p);tx.fillRect(tr.bx[0],BASE-.5,tr.bx[1]-tr.bx[0],EXT+.5)};
    put(0,a);const m=6,dx=L/m;for(let k=1;k<=m;k++)put(k*dx,a*.2*(1-(k-1)/m))};            // traînée de flou vers l'arrière
  const list=[];
  for(const p of PASS){const xl=leftOf(p,t);if(xl>FW+X0+60||xl+p.ws<X0-60)continue;list.push([p.f,TR[p.i],xl+p.ws/2,p.cx0,p.sc,p.a,p.f*V*Math.max(gv,GF)*.03])}

    const r=ss((t-4.8)/1.6);if(r>0){fx.globalCompositeOperation="destination-out";fx.globalAlpha=r;fx.fill(SLIVER);fx.globalAlpha=1;fx.globalCompositeOperation="source-over"}}
  drawTrees(t,Dd,gv);
  fx.setTransform(1,0,0,1,0,0);fx.globalCompositeOperation="xor";fx.drawImage(tl,0,0);
  fx.globalCompositeOperation="destination-in";fx.setTransform(s,0,0,s,-X0*s,-Y0*s);fx.fillRect(X0-80,Y0-80,FW+160,BASE-Y0+80);fx.globalCompositeOperation="source-over";   // recoupe à la ligne de sol

const FIX=q.has("t");
// Lecture : le temps de l'animation n'avance que lorsque le cadre est réellement visible à l'écran.
// Elle démarre au début quand on arrive sur le cadre, se met en pause quand on le quitte, et reprend là où elle en était.
let tt=0,last=0,running=false,done=false,seen=false;
function frame(now){
  if(!running)return;
  tt+=Math.min(.1,(now-last)/1e3);last=now;                      // plafonné : pas de saut après une pause ou un ralentissement du navigateur

  draw(tt);requestAnimationFrame(frame)}

function pause(){running=false}
function replay(){if(FIX||reduce)return;tt=0;done=false;draw(0);running=false;play()}

  draw(0);                                                          // première image : la forme et les premiers arbres déjà en route
  if("IntersectionObserver"in window){

  }else play();
}
cv.addEventListener("click",replay);addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();replay()}});
